// TOAST
window.showToast = function(message){
    const toast = document.getElementById("toast");
    document.getElementById("toastMessage").textContent = message;
    toast.classList.remove("opacity-0","pointer-events-none");
    toast.classList.add("opacity-100");

// ERROR HANDLER
function firebaseError(error){
    console.error("Firebase Error:",error);

    const messages = {
        "auth/email-already-in-use":"This email is already registered!",
        "auth/invalid-email":"Please enter a valid email!",
        "auth/weak-password":"Password must be at least 6 characters!",
        "auth/user-not-found":"Account not found. Please register first.",
        "auth/wrong-password":"Incorrect password!",
        "auth/invalid-credential":"Invalid Email or Password!",
        "auth/too-many-requests":"Too many attempts. Try again later.",
        "auth/network-request-failed":"Internet connection problem!",
        "auth/operation-not-allowed":"Enable Email/Password in Firebase Authentication.",
        "permission-denied":"Firestore permission denied. Check Firestore Rules."
    };

    showToast("⚠️ "+(messages[error.code] || error.message || "Something went wrong."));
}

// FIND STUDENT
async function findStudent(loginInput){
    const field = loginInput.includes("@") ? "email" : "mobile";

    const q = query(
        collection(db,"students"),
        where(field,"==",loginInput)
    );

    const result = await getDocs(q);

    if(result.empty) return null;

    const studentDoc = result.docs[0];

    return {
        id:studentDoc.id,
        ...studentDoc.data()
    };
}

// CHECK DUPLICATE
async function checkDuplicate(mobile,email){
    const mobileQuery = query(
        collection(db,"students"),
        where("mobile","==",mobile)
    );

    const emailQuery = query(
        collection(db,"students"),
        where("email","==",email)
    );

    const [mobileResult,emailResult] = await Promise.all([
        getDocs(mobileQuery),
        getDocs(emailQuery)
    ]);

    return {
        mobileExists:!mobileResult.empty,
        emailExists:!emailResult.empty
    };
}

// STUDENT REGISTRATION WITH EMAIL VERIFICATION
window.initiateRegistrationOTP = async function(event){
    event.preventDefault();

    const name = document.getElementById("regName").value.trim();
    const mobile = document.getElementById("regPhone").value.trim();
    const email = document.getElementById("regEmail").value.trim().toLowerCase();
    const studentClass = document.getElementById("regClass").value;
    const state = document.getElementById("regState").value;
    const district = document.getElementById("regDistrict").value;
    const password = document.getElementById("regPassword").value;

    if(!name || !mobile || !email || !studentClass || !district || !password){
        showToast("Please fill all registration details!");
        return;
    }

    if(!/^[6-9]\d{9}$/.test(mobile)){
        showToast("Enter a valid 10-digit mobile number!");
        return;
    }

    if(password.length<6){
        showToast("Password must be at least 6 characters!");
        return;
    }

    try{
        showToast("Checking mobile and email...");

        const duplicate = await checkDuplicate(mobile,email);

        if(duplicate.mobileExists){
            showToast("This mobile number is already registered!");
            return;
        }

        if(duplicate.emailExists){
            showToast("This email is already registered!");
            return;
        }

        showToast("Creating your account...");

        const credential = await createUserWithEmailAndPassword(
            auth,email,password
        );

        const user = credential.user;

        const studentData = {
            uid:user.uid,
            name,
            mobile,
            email,
            class:studentClass,
            state,
            district,
            status:"pending",
            emailVerified:false,
            createdAt:new Date().toISOString()
        };

        await setDoc(doc(db,"students",user.uid),studentData);

        await sendEmailVerification(user);
        await signOut(auth);

        document.getElementById("registerForm").reset();

        showToast("Verification email sent! Open your email and verify your account.");

    }catch(error){
        firebaseError(error);
    }
};

// ADMIN AND STUDENT LOGIN
window.handleLogin = async function(event){
    event.preventDefault();

    const rawInput = document.getElementById("loginPhone").value.trim();
    const loginInput = rawInput.includes("@")
        ? rawInput.toLowerCase()
        : rawInput;

    const password = document.getElementById("loginPassword").value;
    const loginButton = document.getElementById("loginButton");

    if(!loginInput || !password){
        showToast("Please enter Mobile/Email and Password!");
        return;
    }

    loginButton.disabled = true;
    loginButton.textContent = "PLEASE WAIT...";

    try{
        let email = loginInput;
        let student = null;

        // Mobile login: Student email खोजो
        // Admin email login में यह query नहीं चलेगी
        if(!loginInput.includes("@")){
            showToast("Checking student account...");

            student = await findStudent(loginInput);

            if(!student){
                showToast("Student account not found!");
                return;
            }

            email = (student.email || "").trim().toLowerCase();

            if(!email){
                showToast("Student email is missing. Contact Admin.");
                return;
            }
        }

        // Firebase Authentication
        showToast("Secure login in progress...");

        const credential = await signInWithEmailAndPassword(
            auth,email,password
        );

        const user = credential.user;

        await reload(user);

        // IMPORTANT: ADMIN CHECK FIRST
        if(
            user.uid === ADMIN_UID &&
            user.email?.toLowerCase() === ADMIN_EMAIL
        ){
            showToast("Welcome Admin!");

            setTimeout(()=>{
                window.location.replace("admin.html");
            },500);

            return;
        }

        // Admin email से गलत UID मिला तो access रोक दो
        if(email === ADMIN_EMAIL && user.uid !== ADMIN_UID){
            await signOut(auth);
            showToast("Admin account verification failed!");
            return;
        }

        // Email login पर Student का रिकॉर्ड खोजो
        if(!student){
            student = await findStudent(user.email.toLowerCase());
        }

        if(!student || student.uid !== user.uid){
            await signOut(auth);
            showToast("Student account not found!");
            return;
        }

        // Student email verification
        if(!user.emailVerified){
            try{
                await sendEmailVerification(user);
                showToast("Email not verified! A new verification link has been sent.");
            }catch(emailError){
                console.error(emailError);
                showToast("Please verify your email using the link already sent.");
            }

            await signOut(auth);
            return;
        }

        // Activate Student
        await updateDoc(doc(db,"students",student.id),{
            status:"active",
            emailVerified:true
        });

        const loggedInStudent = {
            ...student,
            uid:user.uid,
            status:"active",
            emailVerified:true
        };

        delete loggedInStudent.password;

        localStorage.setItem(
            "currentStudent",
            JSON.stringify(loggedInStudent)
        );

        showToast("Welcome back, "+(student.name || "Student")+"!");

        setTimeout(()=>{
            window.location.replace("dashboard.html");
        },700);

    }catch(error){
        firebaseError(error);

    }finally{
        loginButton.disabled = false;
        loginButton.textContent = "LOG IN";
    }
};

        showToast("Please enter your email!");
        return;
    }

    button.disabled = true;
    button.textContent = "Sending Link...";

    try{
        await sendPasswordResetEmail(auth,email);

        showToast("Password reset link sent! Check your email.");

        document.getElementById("forgotForm").reset();
        closeForgotModal();

    }catch(error){
        firebaseError(error);

    }finally{
        button.disabled = false;
        button.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i>Send Link';
    }
};

// OTP MODAL
window.closeOtpModal = function(){
    document.getElementById("otpModal").classList.add("hidden");
    document.getElementById("otpModal").classList.remove("flex");
};

window.verifyOtpAndComplete = function(){
    showToast("Mobile OTP is not enabled in this registration flow. Email verification is used.");
};

</script>
